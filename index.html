<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Drink Nearby V0.2</title>

  <link
    href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">DRINK NEARBY · V0.2</p>
        <h1>現在最快去哪裡喝？</h1>
      </div>
      <button id="locateBtn" class="icon-button" type="button" title="回到我的位置" aria-label="回到我的位置">
        ◎
      </button>
    </header>

    <section class="location-search" aria-label="搜尋地點">
      <form id="searchForm" class="search-form">
        <div class="search-input-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            id="searchInput"
            type="search"
            inputmode="search"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="搜尋地點、捷運站或地址"
            aria-label="搜尋地點、捷運站或地址"
          />
        </div>
        <button id="searchBtn" class="search-button" type="submit">搜尋</button>
      </form>

      <button id="useMyLocationBtn" class="my-location-button" type="button">
        <span aria-hidden="true">📍</span> 使用我的目前位置
      </button>

      <div id="geocodePanel" class="geocode-panel hidden" aria-live="polite">
        <div class="geocode-heading">
          <strong id="geocodeTitle">搜尋結果</strong>
          <button id="closeGeocodeBtn" class="text-button" type="button">關閉</button>
        </div>
        <div id="geocodeResults" class="geocode-results"></div>
      </div>
    </section>

    <section class="status-card" aria-live="polite">
      <div class="status-dot" id="statusDot"></div>
      <div>
        <strong id="statusTitle">等待定位</strong>
        <p id="statusText">允許瀏覽器取得位置，或直接搜尋想先查看的地點。</p>
      </div>
    </section>

    <nav class="filters" aria-label="地點類型">
      <button class="filter active" data-filter="all" type="button">全部 <span id="countAll">0</span></button>
      <button class="filter" data-filter="convenience" type="button">🏪 超商 <span id="countConvenience">0</span></button>
      <button class="filter" data-filter="vending" type="button">🥤 販賣機 <span id="countVending">0</span></button>
      <button class="filter" data-filter="bubble_tea" type="button">🧋 手搖 <span id="countBubbleTea">0</span></button>
    </nav>

    <main>
      <section class="map-wrap">
        <div id="map" aria-label="附近飲料地圖"></div>
        <div id="mapLoading" class="map-loading hidden">搜尋附近地點中…</div>
      </section>

      <section class="results-section">
        <div class="results-heading">
          <div>
            <p class="eyebrow">NEARBY</p>
            <h2 id="resultsTitle">距離最近</h2>
          </div>
          <span id="resultMeta" class="result-meta">尚未搜尋</span>
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon">📍</div>
          <h3>先取得你的位置</h3>
          <p>也可以直接在上方搜尋「台北101」、「西門站」或地址。</p>
          <button id="startBtn" class="primary-button" type="button">開始定位</button>
          <button id="taipeiTestBtn" class="secondary-button" type="button">改用台北車站測試</button>
        </div>

        <div id="results" class="results-list"></div>
      </section>
    </main>

    <footer>
      V0.2 地點資料來自 OpenStreetMap / Overpass；地點搜尋由 OpenStreetMap Nominatim 提供；地圖來自 OpenFreeMap。資料可能不完整。
    </footer>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
