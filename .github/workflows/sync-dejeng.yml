name: Sync Dejeng Stores

on:
  workflow_dispatch:
  schedule:
    # 每週日台灣時間約 04:20（UTC 週六 20:20）
    - cron: "20 20 * * 6"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sync Dejeng official stores
        run: npm run sync:dejeng

      - name: Geocode stores missing coordinates
        run: npm run geocode:dejeng

      - name: Validate result
        run: |
          node - <<'NODE'
          const d = require('./data/dejeng.json');

          console.log('Stores:', d.meta.store_count);
          console.log('Geocoded:', d.meta.geocoded_count);
          console.log('Missing coordinates:', d.meta.missing_coordinates);

          const muxin = d.stores.find(s =>
            s.branch?.includes('木新') ||
            s.address?.includes('木新路')
          );

          if (!muxin) {
            throw new Error('台北木新不存在');
          }

          console.log(
            '木新:',
            muxin.name,
            muxin.lat,
            muxin.lng
          );
          NODE

      - name: Commit updated store data
        if: always()
        run: |
          if git diff --quiet -- data/dejeng.json; then
            echo "No store data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/dejeng.json
          git commit -m "chore: sync and geocode Dejeng stores"
          git push
